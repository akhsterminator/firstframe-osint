name: Bug
description: Something broke.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `pnpm doctor`
      render: text
  - type: input
    id: env
    attributes:
      label: OS, Node version, and how you're running it (dev, Docker, CLI)
