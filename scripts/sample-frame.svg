<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5E7389"/>
      <stop offset="0.55" stop-color="#C9B9A3"/>
      <stop offset="1" stop-color="#E9C99A"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8D8A80"/>
      <stop offset="1" stop-color="#3E4247"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9D6B8" stop-opacity="0"/>
      <stop offset="1" stop-color="#E9D6B8" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="table" tableValues="0 0.10"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
    <filter id="blurfar"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>

  <g filter="url(#grain)">
    <rect width="1280" height="720" fill="url(#sky)"/>
    <circle cx="300" cy="300" r="46" fill="#F6E3BF" opacity="0.85" filter="url(#blurfar)"/>

    <!-- distant hills -->
    <path d="M0 360 C180 330 300 345 420 338 C560 330 700 352 860 340 C1000 330 1150 344 1280 336 V420 H0Z" fill="#8F9483" opacity="0.65" filter="url(#blurfar)"/>

    <!-- terrace row -->
    <g fill="#6C5E50">
      <path d="M0 330 L60 300 L120 330 V430 H0Z"/>
      <path d="M120 336 L170 306 L220 336 V430 H120Z" fill="#776757"/>
      <path d="M220 330 L280 296 L340 330 V430 H220Z"/>
      <path d="M340 338 L392 310 L444 338 V430 H340Z" fill="#7C6A58"/>
      <path d="M444 332 L500 300 L556 332 V430 H444Z" fill="#6A5B4D"/>
    </g>
    <g fill="#E7CF9F" opacity="0.9">
      <rect x="24" y="360" width="16" height="22"/><rect x="74" y="360" width="16" height="22"/>
      <rect x="150" y="364" width="14" height="20"/><rect x="250" y="358" width="16" height="22"/>
      <rect x="300" y="358" width="16" height="22"/><rect x="372" y="366" width="14" height="20"/>
      <rect x="470" y="360" width="16" height="22"/><rect x="520" y="360" width="16" height="22"/>
    </g>
    <g fill="#4E4339"><rect x="40" y="290" width="10" height="22"/><rect x="262" y="286" width="10" height="20"/><rect x="480" y="290" width="10" height="20"/></g>

    <!-- church with spire -->
    <g fill="#5B5148">
      <path d="M800 160 L826 290 H774Z"/>
      <rect x="774" y="290" width="52" height="150"/>
      <path d="M826 330 L900 290 L974 330 V440 H826Z" fill="#665A4E"/>
      <rect x="840" y="350" width="10" height="34" fill="#E2C78F" opacity="0.7"/>
      <rect x="900" y="350" width="10" height="34" fill="#E2C78F" opacity="0.7"/>
      <rect x="944" y="350" width="10" height="34" fill="#E2C78F" opacity="0.7"/>
      <path d="M792 320 a8 8 0 0 1 16 0 v18 h-16z" fill="#E2C78F" opacity="0.7"/>
    </g>
    <path d="M800 150 v-14 M794 142 h12" stroke="#5B5148" stroke-width="3"/>

    <!-- trees -->
    <g fill="#55604A">
      <ellipse cx="660" cy="372" rx="70" ry="56"/>
      <ellipse cx="1060" cy="364" rx="90" ry="66"/>
      <ellipse cx="1190" cy="380" rx="70" ry="50" fill="#4C5643"/>
    </g>

    <!-- bridge -->
    <path d="M520 430 H1280 V470 H520Z" fill="#7D6E5E"/>
    <path d="M520 426 H1280" stroke="#9B8B78" stroke-width="5"/>

    <!-- road and roundabout -->
    <path d="M0 430 H560 V520 H0Z" fill="#4D4D4B"/>
    <ellipse cx="300" cy="470" rx="120" ry="26" fill="#6E7A57"/>
    <ellipse cx="300" cy="470" rx="120" ry="26" fill="none" stroke="#D9D2C2" stroke-width="3" stroke-dasharray="14 10"/>
    <path d="M0 512 H560" stroke="#D9D2C2" stroke-width="3" stroke-dasharray="26 18"/>

    <!-- road sign: roundabout ahead -->
    <rect x="114" y="372" width="5" height="96" fill="#3A3A3A"/>
    <path d="M116 334 L146 384 H86Z" fill="#F4F1EA" stroke="#B9332A" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="116" cy="368" r="9" fill="none" stroke="#222" stroke-width="3"/>

    <!-- lamp posts -->
    <g stroke="#2E2E2E" stroke-width="4" fill="none"><path d="M460 470 V360 q0 -12 14 -12 h16"/><path d="M40 470 V370 q0 -12 14 -12 h14"/></g>
    <circle cx="492" cy="352" r="6" fill="#FFE2A6"/><circle cx="70" cy="362" r="6" fill="#FFE2A6"/>

    <!-- river -->
    <path d="M0 520 H560 V470 H1280 V720 H0Z" fill="url(#water)"/>
    <g opacity="0.35" filter="url(#soft)">
      <path d="M560 520 h120 v12 h-120z M720 520 h120 v14 h-120z M880 520 h120 v12 h-120z" fill="#C9B9A3"/>
      <path d="M790 520 v120" stroke="#5B5148" stroke-width="40"/>
      <path d="M0 560 H1280 M0 600 H1280 M0 650 H1280" stroke="#D8C6A6" stroke-width="2" stroke-dasharray="40 60"/>
    </g>
    <path d="M520 470 V500 H1280 V470Z" fill="#7D6E5E"/>
    <path d="M560 500 a60 40 0 0 1 120 0Z M720 500 a60 40 0 0 1 120 0Z M880 500 a60 40 0 0 1 120 0Z M1040 500 a60 40 0 0 1 120 0Z M1200 500 a60 40 0 0 1 120 0Z" fill="#454A4C"/>
    <path d="M520 500 H1280" stroke="#5E5447" stroke-width="2"/>
    <rect width="1280" height="720" fill="url(#haze)" opacity="0.6"/>
  </g>
</svg>
